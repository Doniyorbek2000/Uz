name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.UZKEY_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.UZKEY_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "UZKEY_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests and APKs
        env:
          UZKEY_KEYSTORE_PASSWORD: ${{ secrets.UZKEY_KEYSTORE_PASSWORD }}
          UZKEY_KEY_ALIAS: ${{ secrets.UZKEY_KEY_ALIAS }}
          UZKEY_KEY_PASSWORD: ${{ secrets.UZKEY_KEY_PASSWORD }}
        run: ./gradlew --stacktrace testDebugUnitTest assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: uzkey-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports
          path: android/app/build/reports
