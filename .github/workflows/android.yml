name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.UZKEY_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.UZKEY_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "UZKEY_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests and APKs
        env:
          UZKEY_KEYSTORE_PASSWORD: ${{ secrets.UZKEY_KEYSTORE_PASSWORD }}
          UZKEY_KEY_ALIAS: ${{ secrets.UZKEY_KEY_ALIAS }}
          UZKEY_KEY_PASSWORD: ${{ secrets.UZKEY_KEY_PASSWORD }}
        run: ./gradlew --stacktrace testDebugUnitTest assembleDebug assembleDebugAndroidTest assembleRelease bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: uzkey-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: uzkey-android-tests
          path: android/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports
          path: android/app/build/reports

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: uzkey-android
          path: apk

      - uses: actions/download-artifact@v4
        with:
          name: uzkey-android-tests
          path: apk-tests

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Screenshots and instrumented UI tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash tools/ci/android_screenshots.sh "$(find apk -path "*/debug/*.apk" | head -1)" docs/screenshots
            bash tools/ci/android_ui_tests.sh "$(ls apk-tests/*.apk | head -1)" build/android-ui-tests.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ui-tests
          path: build/android-ui-tests*.txt
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: docs/screenshots/android-*.png

      - name: Commit screenshots
        if: github.event_name == 'push'
        run: bash tools/ci/commit_screenshots.sh "Update Android screenshots"
