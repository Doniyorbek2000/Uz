name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Branches of this repository are already built on push; run pull requests only when they come from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Unit tests (simulator)
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ids = [d["udid"] for runtime, items in sorted(devices.items(), reverse=True) if "iOS" in runtime for d in items if d["name"].startswith("iPhone")]
          print(ids[0])
          ')
          echo "Testing on simulator $DEVICE_ID"
          mkdir -p "$GITHUB_WORKSPACE/docs/screenshots"
          TEST_RUNNER_SNAPSHOT_DIR="$GITHUB_WORKSPACE/docs/screenshots" \
            xcodebuild test -project UzKey.xcodeproj -scheme UzKey -destination "id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/xcodebuild-test.log" 2>&1 || { grep -E "error:|failed|Test Case" "$RUNNER_TEMP/xcodebuild-test.log" | tail -150; tail -40 "$RUNNER_TEMP/xcodebuild-test.log"; exit 1; }
          grep -E "^(Test Suite|Test Case .*(passed|failed))|error:|dictionary |suggest latency|^load " "$RUNNER_TEMP/xcodebuild-test.log" || true
          ls -la "$GITHUB_WORKSPACE/docs/screenshots"

      - name: Build unsigned IPA
        run: |
          set -euo pipefail
          xcodebuild build -project UzKey.xcodeproj -scheme UzKey -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -quiet
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/UzKey.app Payload/
          test -d Payload/UzKey.app/PlugIns/UzKeyKeyboard.appex
          # App Store Connect rejects uploads whose app or extension lacks a privacy manifest.
          test -f Payload/UzKey.app/PrivacyInfo.xcprivacy
          test -f Payload/UzKey.app/PlugIns/UzKeyKeyboard.appex/PrivacyInfo.xcprivacy
          test -f Payload/UzKey.app/PlugIns/UzKeyKeyboard.appex/shared/dictionaries/uz_latn_2027.txt
          zip -qr UzKey-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: docs/screenshots/ios-*.png

      - uses: actions/upload-artifact@v4
        with:
          name: uzkey-ios-unsigned
          path: ios/UzKey-unsigned.ipa
          if-no-files-found: error

      - name: Commit screenshots
        if: github.event_name == 'push'
        working-directory: .
        run: bash tools/ci/commit_screenshots.sh "Update iOS screenshots"
