name: iOS release

# Builds, signs and uploads the app to App Store Connect (TestFlight). Run it from Actions → iOS release → Run workflow.
# Needs repository secrets from an App Store Connect API key with the Admin role (Users and Access → Integrations):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the full text of the downloaded AuthKey_XXXX.p8 file).
# Signing is automatic: Xcode creates the distribution certificate and profiles with that key.
on:
  workflow_dispatch:

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    env:
      TEAM_ID: UL3A6A7RW5
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret $name is missing"; exit 1; fi
          done

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Write API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          # Rebuild the PEM so a secret pasted from Windows (CRLF), on one line or without the BEGIN/END lines still works.
          body=$(printf '%s' "$ASC_KEY_P8" | sed -e 's/-----[A-Z ]*-----//g' | tr -d ' \t\r\n')
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s' "$body" | fold -w 64; echo; echo "-----END PRIVATE KEY-----"; } > "$RUNNER_TEMP/AuthKey.p8"
          openssl pkey -in "$RUNNER_TEMP/AuthKey.p8" -noout || { echo "::error::ASC_KEY_P8 is not a valid .p8 private key"; exit 1; }
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          # App Store Connect needs a higher build number for every upload.
          xcodebuild archive -project UzKey.xcodeproj -scheme UzKey -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/UzKey.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > "$RUNNER_TEMP/archive.log" 2>&1 || { grep -E "error:|warning: .*sign" "$RUNNER_TEMP/archive.log" | tail -60; tail -40 "$RUNNER_TEMP/archive.log"; exit 1; }

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/UzKey.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }}. It appears in App Store Connect → TestFlight after processing."

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
