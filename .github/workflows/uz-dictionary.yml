name: Uzbek dictionary

on:
  workflow_dispatch:
  push:
    paths:
      - tools/build_uz_corpus.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Count corpus word frequencies
        run: python3 tools/build_uz_corpus.py --work-dir "$RUNNER_TEMP/corpus"

      - name: Rebuild bundled dictionaries
        run: |
          pip install --quiet wordfreq
          python3 tools/build_dictionaries.py
          head -40 tools/uz_corpus_freq.tsv
          wc -l shared/dictionaries/*.txt

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/uz_corpus_freq.tsv shared/dictionaries
          if git diff --cached --quiet; then
            echo "No dictionary changes"
            exit 0
          fi
          git commit -m "Rebuild Uzbek dictionaries from corpus frequencies"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
