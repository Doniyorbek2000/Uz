name: iOS store screenshots

# App Store Connect needs iPhone 6.9" (1320x2868) and iPad 13" (2064x2752) screenshots.
# The keyboard extension cannot be switched on in a simulator, so this takes the real app screen from a simulator
# and draws the real keyboard view (rendered by SnapshotTests) where the system keyboard would sit.
# Output is committed to docs/store/appstore/.
on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: macos-15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install xcodegen
          python3 -m pip install --break-system-packages pillow

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick simulators
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          python3 - "$RUNNER_TEMP/devices.json" >> "$GITHUB_ENV" <<'EOF'
          import json, sys
          devices = [d for runtime, items in sorted(json.load(open(sys.argv[1]))["devices"].items(), reverse=True)
                     if "iOS" in runtime for d in items]
          def pick(label, match):
              found = [d for d in devices if match(d["name"])]
              if not found:
                  sys.exit("no simulator for " + label)
              return found[0]["udid"]
          print("IPHONE_ID=" + pick("iPhone Pro Max", lambda n: n.startswith("iPhone") and n.endswith("Pro Max")))
          print("IPAD_ID=" + pick("iPad Pro 13-inch", lambda n: n.startswith("iPad Pro 13-inch")))
          EOF

      - name: Render keyboards
        run: |
          set -euo pipefail
          TEST_RUNNER_STORE_SNAPSHOT_DIR="$RUNNER_TEMP/keyboards" \
            xcodebuild test -project UzKey.xcodeproj -scheme UzKey -destination "id=$IPHONE_ID" CODE_SIGNING_ALLOWED=NO \
            -only-testing:UzKeyTests/SnapshotTests/testRenderStoreKeyboards > "$RUNNER_TEMP/test.log" 2>&1 \
            || { grep -E "error:|failed" "$RUNNER_TEMP/test.log" | tail -60; exit 1; }
          ls -la "$RUNNER_TEMP/keyboards"

      - name: Build app for simulator
        run: |
          xcodebuild build -project UzKey.xcodeproj -scheme UzKey -sdk iphonesimulator -destination "id=$IPHONE_ID" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet

      - name: Capture app screens
        run: |
          set -euo pipefail
          APP=build/Build/Products/Debug-iphonesimulator/UzKey.app
          for pair in "iphone:$IPHONE_ID" "ipad:$IPAD_ID"; do
            name=${pair%%:*}; id=${pair#*:}
            xcrun simctl boot "$id" || true
            xcrun simctl bootstatus "$id" -b
            xcrun simctl ui "$id" appearance light
            xcrun simctl status_bar "$id" override --time 9:41 --dataNetwork wifi --wifiBars 3 --cellularBars 4 --batteryState charged --batteryLevel 100
            xcrun simctl install "$id" "$APP"
            xcrun simctl launch "$id" uz.uzkey.app
            sleep 8
            xcrun simctl io "$id" screenshot "$RUNNER_TEMP/app-$name.png"
          done

      - name: Compose screenshots
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p docs/store/appstore
          python3 - "$RUNNER_TEMP" docs/store/appstore <<'EOF'
          import pathlib, sys
          from PIL import Image
          temp, out = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          # name: (required size, bottom safe-area inset in pixels below the keyboard)
          devices = {"iphone": ((1320, 2868), 34 * 3), "ipad": ((2064, 2752), 20 * 2)}
          for name, (size, inset) in devices.items():
              app = Image.open(temp / f"app-{name}.png").convert("RGB")
              assert app.size == size, f"{name} screen is {app.size}, App Store needs {size}"
              for keyboard_path in sorted((temp / "keyboards").glob(f"ios-{name}-*.png")):
                  keyboard = Image.open(keyboard_path).convert("RGB")
                  assert keyboard.width == size[0], (keyboard_path, keyboard.size)
                  shot = app.copy()
                  top = size[1] - inset - keyboard.height
                  # The keyboard background continues under the home indicator, as on a device.
                  shot.paste(keyboard.getpixel((2, keyboard.height - 2)), (0, top, size[0], size[1]))
                  shot.paste(keyboard, (0, top))
                  target = out / keyboard_path.name.removeprefix("ios-")
                  shot.save(target)
                  print(target, shot.size)
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: appstore-screenshots
          path: docs/store/appstore/*.png

      - name: Commit screenshots
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/store/appstore
          git diff --cached --quiet && { echo "Screenshots unchanged"; exit 0; }
          git commit -m "Update App Store screenshots"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
